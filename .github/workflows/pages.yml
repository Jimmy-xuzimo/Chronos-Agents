name: Deploy product website
on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/screenshots/**', '.github/workflows/pages.yml', 'scripts/check_site.py']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit source and verify static links
        run: |
          python scripts/check_public.py
          python scripts/check_site.py
      - uses: actions/configure-pages@v5
      - name: Prepare current application previews
        run: |
          test -f website/assets/hub.png
          touch website/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
