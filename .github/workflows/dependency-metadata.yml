name: Propose Android dependency checksums
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      # Maintenance proposal only. No auto-commit or publication. Review its diff
      # against official upstreams, then rerun the strict default workflow.
      - run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:exportRuntimeInventory --write-verification-metadata sha256 --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proposed-android-verification
          path: |
            clients/android/gradle/verification-metadata.xml
            clients/android/app/build/reports/dependency-verification/
          retention-days: 7
